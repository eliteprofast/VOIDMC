# Render blueprint for the VSMP site. Create it with: New > Blueprint > pick this repo.
services:
  - type: web
    name: voidmc
    runtime: node
    plan: free            # free = data (accounts, gallery, orders) is wiped on every restart/deploy.
                          # To keep data: change to "starter" and uncomment the disk block below.
    buildCommand: echo "no build step"
    startCommand: node server.js
    healthCheckPath: /login.html
    envVars:
      - key: OWNER_PASSWORD     # you type this in the Render dashboard, it is never stored in git
        sync: false
      - key: SUPABASE_URL               # free outside storage (Supabase): keeps accounts, links, gallery and images across restarts
        sync: false
      - key: SUPABASE_SERVICE_KEY       # the secret "service_role" key (never put it in git)
        sync: false
      - key: UPSTASH_REDIS_REST_URL     # free outside storage: keeps accounts, links, gallery and images across restarts
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: RCON_PASSWORD              # optional: lets the admin console run Minecraft server commands (enable RCON in server.properties first)
        sync: false
      - key: RCON_PORT
        value: "25575"
      - key: DISCORD_BOT_TOKEN          # the bot token for the live chat (never put it in git)
        sync: false
      - key: DISCORD_CLIENT_ID          # Discord application > OAuth2 > Client ID (for "Continue with Discord")
        sync: false
      - key: DISCORD_CLIENT_SECRET      # Discord application > OAuth2 > Client Secret (never put it in git)
        sync: false
      - key: DISCORD_GUILD_ID
        value: "1545479832769536073"
      - key: DISCORD_STAFF_WEBHOOK_URL   # optional: staff notifications
        sync: false
      - key: TRUST_PROXY
        value: "1"
      # - key: DATA_DIR
      #   value: /var/data
    # disk:
    #   name: vsmp-data
    #   mountPath: /var/data
    #   sizeGB: 1
