<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="VSMP emblem">
  <defs>
    <linearGradient id="rim" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#C4E8FF"/><stop offset="0.5" stop-color="#3F86F2"/><stop offset="1" stop-color="#1A3FA6"/>
    </linearGradient>
    <radialGradient id="plate" cx="0.5" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#5FB6FF"/><stop offset="0.55" stop-color="#2F6FE0"/><stop offset="1" stop-color="#1A3A9E"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.6"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1A5A"/><stop offset="1" stop-color="#050A1E"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="256" cy="256" r="226"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- badge: rim and plate -->
  <circle cx="256" cy="256" r="252" fill="#0A1245"/>
  <circle cx="256" cy="256" r="246" fill="url(#rim)"/>
  <circle cx="256" cy="256" r="228" fill="#12307F"/>
  <circle cx="256" cy="256" r="224" fill="url(#plate)"/>
  <path d="M70 150 A210 210 0 0 1 230 48" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="7" stroke-linecap="round"/>

  <g clip-path="url(#disc)">
    <circle cx="256" cy="150" r="140" fill="url(#glow)"/>

    <!-- crystal cluster above the banner -->
    <g stroke="#0A1245" stroke-width="5" stroke-linejoin="round">
      <!-- small left -->
      <polygon points="168,196 190,176 212,196 212,206 168,206" fill="#2F7BE0"/>
      <polygon points="168,196 190,176 190,206 168,206" fill="#4DB5FF"/>
      <!-- small right -->
      <polygon points="300,196 322,176 344,196 344,206 300,206" fill="#6A2FC9"/>
      <polygon points="300,196 322,176 322,206 300,206" fill="#9A5BEA"/>
      <!-- big centre -->
      <polygon points="256,40 306,92 306,206 206,206 206,92" fill="#3A62E6"/>
      <polygon points="256,40 206,92 206,206 256,206" fill="#6CC8FF"/>
      <polygon points="256,40 306,92 256,124 206,92" fill="#E8F8FF"/>
    </g>
    <path d="M222 100 L222 150" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
    <path d="M222 162 L222 172" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.6"/>

    <!-- crystals below the banner -->
    <g stroke="#0A1245" stroke-width="5" stroke-linejoin="round">
      <polygon points="256,318 296,352 296,432 216,432 216,352" fill="#3A62E6"/>
      <polygon points="256,318 216,352 216,432 256,432" fill="#6CC8FF"/>
      <polygon points="256,318 296,352 256,376 216,352" fill="#E8F8FF"/>
      <polygon points="170,372 196,392 196,432 144,432 144,392" fill="#2F7BE0"/>
      <polygon points="170,372 144,392 144,432 170,432" fill="#4DB5FF"/>
      <polygon points="342,372 368,392 368,432 316,432 316,392" fill="#6A2FC9"/>
      <polygon points="342,372 316,392 316,432 342,432" fill="#9A5BEA"/>
    </g>

    <!-- sparkles -->
    <g fill="#FFFFFF">
      <path d="M118 120 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5z"/>
      <path d="M396 110 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4z"/>
      <path d="M404 350 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
      <path d="M108 340 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
    </g>

    <!-- the name banner across the middle -->
    <rect x="20" y="212" width="472" height="90" fill="#000" opacity="0.35" filter="url(#soft)"/>
    <rect x="20" y="212" width="472" height="90" fill="url(#band)"/>
    <rect x="20" y="212" width="472" height="3.5" fill="#4DB5FF"/>
    <rect x="20" y="298.5" width="472" height="3.5" fill="#4DB5FF"/>

    <!-- VSMP, drawn as strokes so it looks the same everywhere (no font needed) -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="10">
      <g stroke="#050A1E" stroke-opacity="0.6" transform="translate(2.5 3.5)" stroke-width="12">
        <path d="M150 236 L171 278 L192 236"/>
        <path d="M242 244 C242 234 232 232 224 232 C214 232 206 237 206 246 C206 256 216 258 224 260 C233 262 242 264 242 272 C242 281 233 284 224 284 C214 284 205 280 205 270"/>
        <path d="M262 280 L262 236 L292 268 L322 236 L322 280"/>
        <path d="M342 280 L342 236 L364 236 C375 236 381 243 381 252 C381 261 375 268 364 268 L342 268"/>
      </g>
      <g stroke="#FFF6E6">
        <path d="M150 236 L171 278 L192 236"/>
        <path d="M242 244 C242 234 232 232 224 232 C214 232 206 237 206 246 C206 256 216 258 224 260 C233 262 242 264 242 272 C242 281 233 284 224 284 C214 284 205 280 205 270"/>
      </g>
      <g stroke="#58BDFF">
        <path d="M262 280 L262 236 L292 268 L322 236 L322 280"/>
        <path d="M342 280 L342 236 L364 236 C375 236 381 243 381 252 C381 261 375 268 364 268 L342 268"/>
      </g>
    </g>
  </g>
</svg>
