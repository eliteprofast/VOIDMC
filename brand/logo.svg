<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="VSMP emblem">
  <defs>
    <linearGradient id="rim" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#A9DCFF"/><stop offset="0.5" stop-color="#3F86F2"/><stop offset="1" stop-color="#1A3FA6"/>
    </linearGradient>
    <radialGradient id="plate" cx="0.5" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#3B2FB8"/><stop offset="0.55" stop-color="#1A1B78"/><stop offset="1" stop-color="#0A1040"/>
    </radialGradient>
    <radialGradient id="moon" cx="0.38" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#FFFBF1"/><stop offset="0.7" stop-color="#F3E6FF"/><stop offset="1" stop-color="#CDB8F0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C9B8FF" stop-opacity="0.55"/><stop offset="1" stop-color="#C9B8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="torii" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7A8E"/><stop offset="1" stop-color="#D2354F"/>
    </linearGradient>
    <linearGradient id="pillar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0516A"/><stop offset="1" stop-color="#B02E4A"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1A5A"/><stop offset="1" stop-color="#050A1E"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="256" cy="256" r="226"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- badge: rim and plate -->
  <circle cx="256" cy="256" r="252" fill="#070C30"/>
  <circle cx="256" cy="256" r="246" fill="url(#rim)"/>
  <circle cx="256" cy="256" r="228" fill="#0A1245"/>
  <circle cx="256" cy="256" r="224" fill="url(#plate)"/>
  <path d="M70 150 A210 210 0 0 1 230 48" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round"/>

  <g clip-path="url(#disc)">
    <!-- stars -->
    <g fill="#FFFFFF">
      <circle cx="110" cy="120" r="3.2" opacity="0.9"/><circle cx="400" cy="96" r="3.6"/><circle cx="148" cy="190" r="2.4" opacity="0.7"/>
      <circle cx="430" cy="190" r="2.6" opacity="0.8"/><circle cx="196" cy="70" r="2.6" opacity="0.8"/><circle cx="330" cy="62" r="2.2" opacity="0.7"/>
      <circle cx="88" cy="332" r="2.4" opacity="0.6"/><circle cx="440" cy="340" r="2.4" opacity="0.6"/>
    </g>
    <!-- the moon, with a soft glow -->
    <circle cx="256" cy="156" r="118" fill="url(#halo)"/>
    <circle cx="256" cy="156" r="74" fill="url(#moon)"/>
    <g fill="#CDB8F0" opacity="0.55"><circle cx="232" cy="136" r="11"/><circle cx="278" cy="172" r="14"/><circle cx="246" cy="184" r="7"/><circle cx="288" cy="128" r="6"/></g>

    <!-- sakura petals -->
    <g>
      <ellipse cx="118" cy="272" rx="11" ry="6.5" fill="#FF8DA1" transform="rotate(-35 118 272)"/>
      <ellipse cx="406" cy="236" rx="10" ry="6" fill="#FFC4D6" transform="rotate(30 406 236)"/>
      <ellipse cx="392" cy="396" rx="10" ry="6" fill="#FF8DA1" transform="rotate(-20 392 396)"/>
      <ellipse cx="122" cy="380" rx="9" ry="5.5" fill="#FFC4D6" transform="rotate(40 122 380)"/>
      <ellipse cx="172" cy="96" rx="9" ry="5.5" fill="#FF8DA1" transform="rotate(25 172 96)"/>
    </g>

    <!-- torii gate -->
    <g>
      <rect x="168" y="352" width="30" height="96" rx="4" fill="url(#pillar)"/>
      <rect x="314" y="352" width="30" height="96" rx="4" fill="url(#pillar)"/>
      <rect x="150" y="386" width="212" height="22" rx="4" fill="#C93A55"/>
      <rect x="148" y="338" width="216" height="20" rx="4" fill="#E8455F"/>
      <path d="M108 318 C176 340 336 340 404 318 L396 342 C330 356 182 356 116 342 Z" fill="url(#torii)"/>
      <path d="M118 322 C180 338 332 338 394 322" fill="none" stroke="#FFC0CB" stroke-opacity="0.7" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- the name banner across the middle -->
    <rect x="20" y="212" width="472" height="90" fill="#000" opacity="0.35" filter="url(#soft)"/>
    <rect x="20" y="212" width="472" height="90" fill="url(#band)"/>
    <rect x="20" y="212" width="472" height="3.5" fill="#4DB5FF"/>
    <rect x="20" y="298.5" width="472" height="3.5" fill="#4DB5FF"/>

    <!-- VSMP, drawn as strokes so it looks the same everywhere (no font needed) -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="10">
      <g stroke="#050A1E" stroke-opacity="0.6" transform="translate(2.5 3.5)" stroke-width="12">
        <path d="M150 236 L171 278 L192 236"/>
        <path d="M242 244 C242 234 232 232 224 232 C214 232 206 237 206 246 C206 256 216 258 224 260 C233 262 242 264 242 272 C242 281 233 284 224 284 C214 284 205 280 205 270"/>
        <path d="M262 280 L262 236 L292 268 L322 236 L322 280"/>
        <path d="M342 280 L342 236 L364 236 C375 236 381 243 381 252 C381 261 375 268 364 268 L342 268"/>
      </g>
      <g stroke="#FFF6E6">
        <path d="M150 236 L171 278 L192 236"/>
        <path d="M242 244 C242 234 232 232 224 232 C214 232 206 237 206 246 C206 256 216 258 224 260 C233 262 242 264 242 272 C242 281 233 284 224 284 C214 284 205 280 205 270"/>
      </g>
      <g stroke="#58BDFF">
        <path d="M262 280 L262 236 L292 268 L322 236 L322 280"/>
        <path d="M342 280 L342 236 L364 236 C375 236 381 243 381 252 C381 261 375 268 364 268 L342 268"/>
      </g>
    </g>
  </g>
</svg>
